spring.application.name=routemath

# Banco de dados MySQL
# A senha NAO fica no codigo: defina a variavel de ambiente DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/routemath?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false